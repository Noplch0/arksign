name: Build & Release

on:
  push:
    branches: [latest]
    tags: ['v*']
  pull_request:
    branches: [latest]

permissions:
  contents: write
  actions: read

jobs:
  # =========================================================================
  # 代码检查 + 测试
  # =========================================================================
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=3m

      - name: Test
        run: go test -v -race -coverprofile=coverage.txt ./...

  # =========================================================================
  # 全平台构建
  # =========================================================================
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Get version
        id: version
        run: echo "VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')" >> $GITHUB_OUTPUT

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.BuildTime=${BUILD_TIME}'"

          case "${{ matrix.os }}" in
            linux)   GOOS=linux   ;;
            darwin)  GOOS=darwin  ;;
            windows) GOOS=windows ;;
          esac

          EXT=""
          [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"

          mkdir -p build
          CGO_ENABLED=0 GOOS=${GOOS} GOARCH=${{ matrix.arch }} \
            go build -ldflags "${LDFLAGS}" \
            -o "dist/arkSign_${{ matrix.os }}_${{ matrix.arch }}${EXT}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkSign_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/*

  # =========================================================================
  # 发布（仅 tag 触发）
  # =========================================================================
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: arkSign_*
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "# ${GITHUB_REF_NAME}" > release_notes.md
          echo "" >> release_notes.md

          if [ -z "$PREV_TAG" ]; then
            echo "## 🆕 初始发布" >> release_notes.md
            echo "" >> release_notes.md
            git log --oneline --no-merges >> release_notes.md
          else
            echo "## 🔄 变更内容 (${PREV_TAG} → ${GITHUB_REF_NAME})" >> release_notes.md
            echo "" >> release_notes.md

            # 按类型分组（Conventional Commits 风格）
            echo "### ✨ 新功能" >> release_notes.md
            git log ${PREV_TAG}..HEAD --oneline --no-merges --grep="^feat" 2>/dev/null | sed 's/^[a-f0-9]* /* /' >> release_notes.md || true
            if ! git log ${PREV_TAG}..HEAD --oneline --no-merges --grep="^feat" 2>/dev/null | grep -q .; then
              echo "_无_" >> release_notes.md
            fi

            echo "" >> release_notes.md
            echo "### 🐛 修复" >> release_notes.md
            git log ${PREV_TAG}..HEAD --oneline --no-merges --grep="^fix" 2>/dev/null | sed 's/^[a-f0-9]* /* /' >> release_notes.md || true
            if ! git log ${PREV_TAG}..HEAD --oneline --no-merges --grep="^fix" 2>/dev/null | grep -q .; then
              echo "_无_" >> release_notes.md
            fi

            echo "" >> release_notes.md
            echo "### 📦 其他" >> release_notes.md
            git log ${PREV_TAG}..HEAD --oneline --no-merges --invert-grep --grep="^feat\|^fix" 2>/dev/null | sed 's/^[a-f0-9]* /* /' >> release_notes.md || true
            if ! git log ${PREV_TAG}..HEAD --oneline --no-merges --invert-grep --grep="^feat\|^fix" 2>/dev/null | grep -q .; then
              echo "_无_" >> release_notes.md
            fi

            echo "" >> release_notes.md
            echo "**完整对比**: [${PREV_TAG}...${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME})" >> release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: artifacts/**
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
